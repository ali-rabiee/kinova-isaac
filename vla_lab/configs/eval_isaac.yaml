# Evaluation config for running a trained TinyVLA inside Isaac Lab using
# the existing `environments/reach_to_grasp_VLA` scene.

ckpt: vla_lab/checkpoints/tiny_v0/last.pt

# Partial observability axis (paper framing: single overhead RGB, optional occlusion).
observability_mode: external_only
occlusion:
  mode: none               # none | bottom_strip | top_strip | center_box | random_patch
  fraction: 0.35
  camera: overhead         # which view the mask hits: overhead | wrist | both

# Camera set fed to the policy (2026-07 wrist camera). null = the checkpoint's
# camera_set (single-camera checkpoints keep the original behavior). A strict
# subset of a two-camera checkpoint runs the missing-view ablation:
#   --cameras overhead | wrist | both     (CLI override)
# For the SmolVLA backend, `smolvla_cameras: both` means the LeRobot dataset was
# exported with --wrist (camera2 = wrist view).
# cameras: null
# smolvla_cameras: overhead

# Policy runner: "tiny" = `vla_lab.train` checkpoint; "smolvla" = LeRobot Hub id or local dir.
policy_backend: tiny
# Path to the LeRobot dataset root produced by `convert_kinova_to_lerobot` (must contain meta/stats.json).
lerobot_dataset_root: null

eval:
  num_episodes: 10
  max_steps_per_episode: 4000
  # MUST match the collection `--log-rate-hz` of the training session:
  # actions are EE deltas per 1/log_rate_hz tick (collect.sh = 5, collect_v3.sh = 15).
  policy_rate_hz: 15
  # Rate the training actions were logged at. If it differs from
  # policy_rate_hz, eval rescales action deltas by train/policy to preserve
  # demo EE speed (and warns). Keep both equal when possible.
  train_action_rate_hz: 15
  device: cuda:0
  # Spawn settings (mirrors `collect_v3.sh` so eval matches collection).
  num_objects: 6
  spawn_mode: box       # 'usd' for YCB, 'box' for uniform cubes (recommended for eval)
  box_size: 0.08
  spawn_min: [0.26, -0.34, 0.89]
  spawn_max: [0.52, 0.36, 1.06]
  min_distance: 0.16
  # Per-action safety clamps (per policy interval). Generous bounds a sane
  # policy never hits — they turn runaway commands into logged clamp events.
  max_action_dpos_m: 0.06
  max_action_drot_rad: 0.30
  # Scripted pre-roll target: drive the EE here (base frame) before the policy
  # takes over. Matches the training session's tick-0 EE pose so the first
  # observation is in-distribution. Set null to disable.
  start_ee_pos_b: [0.454, 0.093, 0.210]
  ee_link: j2n6s300_end_effector
  workspace_min_z: 0.0
  workspace_max_z: 1.20
  # Receding-horizon execution: only consume this many actions of each
  # predicted chunk before re-querying the model. 1 = pure receding.
  chunk_consume: 1
  # Success criterion: lift Z increase (m).
  lift_success_min_dz_m: 0.06
  out_dir: vla_lab/eval_results/tiny_v0
  # Stable per-episode language template selection (matches vla_v1).
  language_seed: 1337
  # Optional: base seed for deterministic random_patch masks; effective seed = base + episode_idx.
  occlusion_patch_seed: null

ttc:
  k_action_samples: 1
  noise_std: 0.1
  selection: naive_consensus
  gating: none                # none | twin_uncertainty | noisy_pair
  gating_noise_std: 0.05
  gating_threshold: 0.02
  # When true and K>1: candidates = one ξ=0 chunk + (K−1) stochastic (see vla_lab/ttc.py).
  include_deterministic_candidate: false
  log_jsonl: null
  latency_log: null

# Human-intent uncertainty + real-time semantic feedback (2026-07; see README §9-10).
# All defaults keep the legacy behavior (no feedback, intent estimator only
# when a controller/feedback is active).
# intent:
#   every_n_ticks: 1        # 0 = off; counterfactual sweep is ~n_objects tiny forwards
#   temperature: 0.02
#   lexical_prior_weight: 0.75
#   geometric_weight: 0.5
# eval.instruction_ambiguity: none   # none | half | full — colorless instructions drive intent uncertainty
# feedback:
#   channel: none           # none | scripted (simulated human) | console (your keyboard)
#   accuracy: 0.95          # scripted human quality knobs -------------------
#   latency_ticks: 3
#   specificity: color      # color | directional | vague
#   noise_rate: 0.0
#   seed: 0
#   trust_threshold: 0.55   # fusion: reliability >= this -> apply corrections
#   ignore_threshold: 0.30  # reliability < this -> ignore
#   fusion_verify: true     # false = trust-all ablation
#   nudge_step_m: 0.02
#   nudge_horizon_ticks: 5
#   auto_resume_ticks: 45

# Act/compute/query controller (HRI-2027 pivot; see README §7).
# `controller: none` keeps the legacy TTC path above. Any other value routes each policy tick
# through vla_lab/allocation (the act/compute/query trichotomy). CLI overrides:
# --controller, --allocator-fit, --emit-calibration.
allocation:
  controller: none          # none | autonomy | fixed_compute | compute_gated | scale | knowno | insight | allocator | intent_allocator
  fit_path: null            # allocator_fit.json from `python -m vla_lab.fit_allocator` (unlocks query / INSIGHT / KnowNo)
  emit_calibration: null    # JSONL path: write per-step calibration records for vla_lab.calibration.analyze
  # Query interface used when a controller escalates to a human:
  query_interface: scripted # scripted = sim oracle (uses the episode's true target); stdin = autonomous console prompt (real robot)
  query_accuracy: 1.0       # scripted-only: P(simulated human answers correctly)
  query_latency_s: 3.0      # scripted-only: simulated interruption cost (s)
  # Uncertainty-type transparency (study condition 4 vs 5). Leave enabled:false for the robot-only runs.
  transparency:
    enabled: false
    signal_type: false      # false: magnitude-only ("unsure"); true: type-aware ("thinking…" vs "I can't see — which one?")
