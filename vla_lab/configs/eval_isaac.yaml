# Evaluation config for running a trained TinyVLA inside Isaac Lab using
# the existing `environments/reach_to_grasp_VLA` scene.

ckpt: vla_lab/checkpoints/tiny_v0/last.pt

# Partial observability axis (paper framing: single overhead RGB, optional occlusion).
observability_mode: external_only
occlusion:
  mode: none               # none | bottom_strip | top_strip | center_box | random_patch
  fraction: 0.35

# Policy runner: "tiny" = `vla_lab.train` checkpoint; "smolvla" = LeRobot Hub id or local dir.
policy_backend: tiny
# Path to the LeRobot dataset root produced by `convert_kinova_to_lerobot` (must contain meta/stats.json).
lerobot_dataset_root: null

eval:
  num_episodes: 10
  max_steps_per_episode: 4000
  policy_rate_hz: 5
  device: cuda:0
  # Spawn settings (mirrors `vla_v1` defaults so eval matches collection).
  num_objects: 3
  spawn_mode: box       # 'usd' for YCB, 'box' for uniform cubes (recommended for eval)
  box_size: 0.08
  spawn_min: [0.28, -0.30, 0.90]
  spawn_max: [0.55, 0.30, 1.05]
  min_distance: 0.20
  ee_link: j2n6s300_end_effector
  workspace_min_z: 0.0
  workspace_max_z: 1.20
  # Receding-horizon execution: only consume this many actions of each
  # predicted chunk before re-querying the model. 1 = pure receding.
  chunk_consume: 1
  # Success criterion: lift Z increase (m).
  lift_success_min_dz_m: 0.06
  out_dir: vla_lab/eval_results/tiny_v0
  # Stable per-episode language template selection (matches vla_v1).
  language_seed: 1337
  # Optional: base seed for deterministic random_patch masks; effective seed = base + episode_idx.
  occlusion_patch_seed: null

ttc:
  k_action_samples: 1
  noise_std: 0.1
  selection: naive_consensus
  scoring: naive_consensus    # legacy alias for `selection`
  gating: none                # none | twin_uncertainty | noisy_pair
  gating_noise_std: 0.05
  gating_threshold: 0.02
  # When true and K>1: candidates = one ξ=0 chunk + (K−1) stochastic (see vla_lab/ttc.py).
  include_deterministic_candidate: false
  log_jsonl: null
  latency_log: null
