# Training config for TinyVLA on `data_collection.collect_data` outputs.
# This is the recommended starting point for the CoRL VLA-TTC pipeline.

# Where the collect_data sessions live. You can list multiple roots if you
# collect across several runs - they will all be merged.
data:
  data_roots:
    # List the session(s) to train on. Only mix sessions with the SAME contract:
    # log rate (15 Hz for collect_v3), camera config, and start pose.
    # NOTE: sessions collected before 2026-06-11 are NOT compatible with new ones:
    # the top-down camera moved (z 4.0 -> 2.2), respawn was frozen (single layout),
    # and episodes contained a logged sag prefix. Prefer training purely on new data.
    # Run `python -m vla_lab.repair_gripper_labels --session <dir>` on sessions
    # collected before the 2026-06 gripper-state logger fix.
    - logs/data_collection/session_20260607_115038
  # Train on successful demonstrations only (reads episode_summary.json / events.jsonl).
  # Failed/truncated episodes are much longer than successful ones and would dominate.
  success_only: true
  image_size: 224
  chunk_len: 8
  state_dim: 4
  action_dim: 7
  drop_no_image: true
  val_fraction: 0.1
  split_seed: 0
  # If non-null, normalize the 6 continuous action dims (delta pose) by
  # mean/std computed from the training set. Recommended.
  normalize_actions: true
  # If True, decode PNGs with torchvision.io (usually faster than PIL).
  fast_image_io: true

model:
  image_size: 224
  embed_dim: 192
  vis_channels: [32, 64, 128, 192]
  vis_strides: [2, 2, 2, 2]
  lang_layers: 2
  lang_heads: 4
  decoder_layers: 2
  decoder_heads: 4
  state_dim: 4
  chunk_len: 8
  action_dim: 7
  max_lang_len: 24
  dropout: 0.05
  # Set >0 to inject Gaussian noise at the bottleneck during training.
  # 0.05 is a sane default that lightly regularizes and makes K-sampling at
  # inference produce diverse candidates.
  noise_std: 0.05

train:
  device: cuda
  num_epochs: 30
  # Larger batches improve GPU utilization for this small model; lower if you OOM.
  batch_size: 512
  # More workers + prefetch helps keep the GPU fed (data loading is often the bottleneck).
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  # Validation DataLoader (default: max(1, num_workers // 2)).
  # val_num_workers: 4
  cudnn_benchmark: true
  # Mixed precision on CUDA (bf16 on Ampere+ when amp_dtype=auto; fp16 uses GradScaler).
  amp: true
  amp_dtype: auto  # auto | bfloat16 | float16
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  log_every: 50
  ckpt_every_epochs: 5
  # Full training state every N optimizer steps (0 = off). Keeps newest `max_step_checkpoints` files.
  save_every_steps: 2000
  max_step_checkpoints: 3
  metrics_file: metrics.jsonl
  out_dir: vla_lab/checkpoints/tiny_v0
  seed: 42
  # Loss weights
  gripper_weight: 2.0     # up-weight discrete gripper column in MSE
  feature_alignment:
    enabled: false        # set true to turn on DINOv2 alignment (needs `transformers`)
    teacher_name: facebook/dinov2-base
    teacher_dim: 768
    pool_to_tokens: 64
    weight: 0.5
