# TinyVLA training on collect_v4 (wrist + overhead) sessions — the two-camera
# variant of train_tiny.yaml. Camera-set ablations: set data.cameras to
# [overhead], [wrist], or [overhead, wrist] (three runs -> three checkpoints).
#
#   ./vla_lab/scripts/train.sh                                   # default single-cam config
#   CONFIG=vla_lab/configs/train_multicam.yaml ./vla_lab/scripts/train.sh
#
# The camera set is recorded in the checkpoint (`camera_set`) and eval builds
# the matching sensors automatically; `--cameras` at eval selects subsets of a
# two-camera checkpoint (missing-view ablation via the camera_present mask).

data:
  data_roots:
    # collect_v4 sessions ONLY for wrist-consuming camera sets (ticks must
    # carry image_wrist); verify each with `python -m vla_lab.verify_session`.
    - logs/data_collection/session_REPLACE_ME
  success_only: true
  image_size: 224
  chunk_len: 8
  state_dim: 4
  action_dim: 7
  drop_no_image: true
  val_fraction: 0.1
  split_seed: 0
  normalize_actions: true
  fast_image_io: true
  # Camera set (stream order matters; must be a subset of what the sessions record):
  cameras: [overhead, wrist]

model:
  image_size: 224
  embed_dim: 192
  vis_channels: [32, 64, 128, 192]
  vis_strides: [2, 2, 2, 2]
  lang_layers: 2
  lang_heads: 4
  decoder_layers: 2
  decoder_heads: 4
  state_dim: 4
  chunk_len: 8
  action_dim: 7
  max_lang_len: 24
  dropout: 0.05
  noise_std: 0.05
  # Train-time per-sample stream dropout (multi-camera only): teaches the
  # two-camera policy to keep working when one view is missing/occluded at
  # eval — the "one camera + our method ≈ two cameras" mechanism.
  camera_dropout: 0.25

train:
  device: cuda
  num_epochs: 30
  batch_size: 256          # two image decodes per sample; halved from 512
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  cudnn_benchmark: true
  amp: true
  amp_dtype: auto
  lr: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  log_every: 50
  ckpt_every_epochs: 5
  save_every_steps: 2000
  max_step_checkpoints: 3
  metrics_file: metrics.jsonl
  out_dir: vla_lab/checkpoints/multicam_v0
  seed: 42
  gripper_weight: 2.0
  feature_alignment:
    enabled: false          # if enabled, aligns the FIRST camera stream (overhead here)
    teacher_name: facebook/dinov2-base
    teacher_dim: 768
    pool_to_tokens: 64
    weight: 0.5
